
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit Doctor - MediCare</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="form-card">
    <h1>Edit Doctor</h1>
    <form method="POST">
        <label>Doctor Name</label>
        <input type="text" name="name" value="{{ doctor['name'] }}" required>

        <label>Specialization</label>
        <input type="text" name="specialization"
               value="{{ doctor['specialization'] }}" required>

        <label>Phone</label>
        <input type="tel" name="phone" value="{{ doctor['phone'] }}" required>

        <label>Email</label>
        <input type="email" name="email" value="{{ doctor['email'] or '' }}">

        <label>Availability</label>
        <select name="availability" required>
            {% for value in ['Available', 'Unavailable'] %}
            <option value="{{ value }}"
                {% if doctor['availability'] == value %}selected{% endif %}>
                {{ value }}
            </option>
            {% endfor %}
        </select>

        <button type="submit">Update Doctor</button>
    </form>
    <p><a href="{{ url_for('view_doctors') }}">Back to Doctors</a></p>
</div>
</body>
</html>
