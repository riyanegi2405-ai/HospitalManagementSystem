
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient | MediCare</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<main class="patient-form-page">
    <h1>Edit Patient</h1>
    <p>Update patient details</p>

    <form method="POST"
          action="{{ url_for('edit_patient', patient_id=patient['id']) }}">

        <label for="name">Full Name</label>
        <input id="name" type="text" name="name"
               value="{{ patient['name'] }}" required>

        <label for="age">Age</label>
        <input id="age" type="number" name="age"
               min="0" max="120"
               value="{{ patient['age'] }}" required>

        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
            {% for option in ["Male", "Female", "Other"] %}
            <option value="{{ option }}"
                {% if patient['gender'] == option %}selected{% endif %}>
                {{ option }}
            </option>
            {% endfor %}
        </select>

        <label for="phone">Phone</label>
        <input id="phone" type="tel" name="phone"
               pattern="[0-9]{10}"
               value="{{ patient['phone'] }}" required>

        <label for="disease">Disease</label>
        <input id="disease" type="text" name="disease"
               value="{{ patient['disease'] }}" required>

        <button type="submit" class="primary-btn">
            Save Changes
        </button>
    </form>

    <p>
        <a href="{{ url_for('view_patients') }}">
            Back to Patients
        </a>
    </p>
</main>

</body>
</html>
